name: preview-e2e
on:
  push:
    branches: [ci/preview-e2e]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q playwright==1.47.0 && python -m playwright install-deps chromium >/dev/null && google-chrome --version
      - run: python .github/preview_e2e.py
